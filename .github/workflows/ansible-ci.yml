---
name: Ansible CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ansible-check:
    name: Ansible lint and syntax check
    runs-on: ubuntu-latest
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible.cfg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Ansible tools
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint

      - name: Show Ansible versions
        run: |
          ansible --version
          ansible-lint --version

      - name: Install Ansible dependencies
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run ansible-lint
        run: |
          ansible-lint .
          # Explicit paths also cover versions that fail to expand the root directory.
          ansible-lint lab1-mongodb/ lab2-opensearch/ requirements.yml

      - name: Run syntax checks
        run: |
          for playbook in lab1-mongodb/playbooks/*.yml lab2-opensearch/playbooks/*.yml lab2-opensearch/site.yml; do
            echo "Checking $playbook"
            ansible-playbook --syntax-check "$playbook"
          done
