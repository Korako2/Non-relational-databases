---
rbac_roles:
  - name: logs_writer
    description: "Write new documents only to the logs data stream"
    cluster_permissions:
      - "indices:data/write/bulk"
    index_permissions:
      - index_patterns:
          - "logs"
        allowed_actions:
          - "indices:data/write/index"
          - "indices:data/write/bulk*"

  - name: logs_reader
    description: "Read documents from the logs data stream"
    cluster_permissions: []
    index_permissions:
      - index_patterns:
          - "logs"
        allowed_actions:
          - "read"

  - name: cluster_monitor
    description: "Read-only OpenSearch monitoring and Prometheus metrics"
    cluster_permissions:
      - "cluster:monitor/prometheus/metrics"
      - "cluster:monitor/health"
      - "cluster:monitor/stats"
      - "cluster:monitor/state"
      - "cluster:monitor/nodes/info"
      - "cluster:monitor/nodes/stats"
    index_permissions:
      - index_patterns:
          - "*"
        allowed_actions:
          - "indices:monitor/stats"
