---
- name: Set paths for HTTPS material
  ansible.builtin.set_fact:
    lab_dashboards_tls_dashboard_key: "{{ lab_dashboards_conf_dir }}/dashboards-server.key"
    lab_dashboards_tls_dashboard_csr: "{{ lab_dashboards_conf_dir }}/dashboards-server.csr"
    lab_dashboards_tls_dashboard_cert: "{{ lab_dashboards_conf_dir }}/dashboards-server.pem"
    lab_dashboards_tls_dashboard_ca: "{{ lab_dashboards_conf_dir }}/root-ca.pem"
    lab_dashboards_tls_dashboard_config: "{{ lab_dashboards_conf_dir }}/opensearch_dashboards.yml"

- name: Copy upstream-generated trusted CA certificate for OpenSearch HTTPS
  ansible.builtin.copy:
    src: "{{ lab_opensearch_conf_dir }}/root-ca.pem"
    dest: "{{ lab_dashboards_tls_dashboard_ca }}"
    remote_src: true
    owner: "{{ os_dashboards_user }}"
    group: "{{ os_dashboards_user }}"
    mode: "0644"
  register: lab_dashboards_tls_dashboard_ca_changed
  notify: Restart dashboards after configuration changes

- name: Save OpenSSL SAN specification for Dashboards browser certificate
  ansible.builtin.copy:
    dest: "{{ lab_dashboards_conf_dir }}/dashboards-san.ext"
    content: |
      basicConstraints=CA:FALSE
      keyUsage=digitalSignature,keyEncipherment
      extendedKeyUsage=serverAuth
      subjectAltName=IP:{{ ip }},IP:127.0.0.1,DNS:{{ inventory_hostname }},DNS:{{ inventory_hostname }}.{{ domain_name }},DNS:localhost
    owner: "{{ os_dashboards_user }}"
    group: "{{ os_dashboards_user }}"
    mode: "0644"

- name: Generate private key for the Dashboards HTTPS endpoint
  ansible.builtin.command:
    argv: [openssl, genrsa, -out, "{{ lab_dashboards_tls_dashboard_key }}", "2048"]
    creates: "{{ lab_dashboards_tls_dashboard_key }}"
  no_log: true

- name: Restrict private-key access
  ansible.builtin.file:
    path: "{{ lab_dashboards_tls_dashboard_key }}"
    owner: "{{ os_dashboards_user }}"
    group: "{{ os_dashboards_user }}"
    mode: "0600"

- name: Create signing request for Dashboards HTTPS endpoint
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -new
      - -key
      - "{{ lab_dashboards_tls_dashboard_key }}"
      - -out
      - "{{ lab_dashboards_tls_dashboard_csr }}"
      - -subj
      - /CN={{ inventory_hostname }}.{{ domain_name }}
    creates: "{{ lab_dashboards_tls_dashboard_csr }}"

- name: Sign the Dashboards certificate with the upstream-generated lab CA
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -req
      - -in
      - "{{ lab_dashboards_tls_dashboard_csr }}"
      - -CA
      - "{{ lab_opensearch_conf_dir }}/root-ca.pem"
      - -CAkey
      - "{{ lab_opensearch_conf_dir }}/root-ca.key"
      - -CAcreateserial
      - -out
      - "{{ lab_dashboards_tls_dashboard_cert }}"
      - -days
      - "365"
      - -sha256
      - -extfile
      - "{{ lab_dashboards_conf_dir }}/dashboards-san.ext"
    creates: "{{ lab_dashboards_tls_dashboard_cert }}"
  no_log: true
  register: lab_dashboards_tls_dashboard_signed
  notify: Restart dashboards after configuration changes

- name: Set Dashboards HTTPS certificate permissions
  ansible.builtin.file:
    path: "{{ lab_dashboards_tls_dashboard_cert }}"
    owner: "{{ os_dashboards_user }}"
    group: "{{ os_dashboards_user }}"
    mode: "0644"

- name: Enable server-side HTTPS in Dashboards
  ansible.builtin.blockinfile:
    path: "{{ lab_dashboards_tls_dashboard_config }}"
    marker: "# {mark} LAB HTTPS SETTINGS"
    block: |
      server.ssl.enabled: true
      server.ssl.certificate: {{ lab_dashboards_tls_dashboard_cert }}
      server.ssl.key: {{ lab_dashboards_tls_dashboard_key }}
      opensearch.ssl.certificateAuthorities: ["{{ lab_dashboards_tls_dashboard_ca }}"]
  register: lab_dashboards_tls_dashboard_https_settings
  notify: Restart dashboards after configuration changes

- name: Verify upstream OpenSearch backend certificate using its CA and host/IP
  ansible.builtin.lineinfile:
    path: "{{ lab_dashboards_tls_dashboard_config }}"
    regexp: "^opensearch\\.ssl\\.verificationMode:"
    line: "opensearch.ssl.verificationMode: full"
  register: lab_dashboards_tls_dashboard_verify_setting
  notify: Restart dashboards after configuration changes

- name: Secure authentication cookies now that server HTTPS is enabled
  ansible.builtin.lineinfile:
    path: "{{ lab_dashboards_tls_dashboard_config }}"
    regexp: "^opensearch_security\\.cookie\\.secure:"
    line: "opensearch_security.cookie.secure: true"
  register: lab_dashboards_tls_dashboard_cookie_setting
  notify: Restart dashboards after configuration changes

- name: Apply pending dashboards restart
  ansible.builtin.meta: flush_handlers

- name: Confirm Dashboards HTTPS listener is reachable from the VM
  ansible.builtin.wait_for:
    host: "{{ ip }}"
    port: 5601
    delay: 4
    timeout: 180

- name: Export the PUBLIC CA certificate to the Ansible controller for browser trust
  ansible.builtin.fetch:
    src: "{{ lab_dashboards_tls_dashboard_ca }}"
    dest: "{{ playbook_dir }}/../files/root-ca.pem"
    flat: true
