---
- name: Security Plugin configuration | Force remove local temporary directory for certificates generation
  run_once: true
  become: false
  when: iac_enable
  delegate_to: localhost
  ansible.builtin.file:
    path: /tmp/opensearch-nodecerts
    state: absent

- name: Security Plugin configuration | Create local temporary directory for certificates generation
  run_once: true
  register: opensearch_configuration
  become: false
  delegate_to: localhost
  ansible.builtin.file:
    path: /tmp/opensearch-nodecerts
    state: directory
    mode: "0700"

- name: Security Plugin configuration | Download certificates generation tool
  run_once: true
  # Must run here: subsequent tasks consume certificates before play handlers run.
  when: opensearch_configuration.changed  # noqa: no-handler
  become: false
  delegate_to: localhost
  ansible.builtin.get_url:
    url: https://search.maven.org/remotecontent?filepath=com/floragunn/search-guard-tlstool/1.5/search-guard-tlstool-1.5.tar.gz
    dest: /tmp/opensearch-nodecerts/search-guard-tlstool.tar.gz
    mode: "0644"

- name: Security Plugin configuration | Extract the certificates generation tool
  run_once: true
  # Must run here: subsequent tasks consume certificates before play handlers run.
  when: opensearch_configuration.changed  # noqa: no-handler
  become: false
  delegate_to: localhost
  ansible.builtin.unarchive:
    src: /tmp/opensearch-nodecerts/search-guard-tlstool.tar.gz
    dest: /tmp/opensearch-nodecerts
    remote_src: true

- name: Security Plugin configuration | Make the executable file
  run_once: true
  # Must run here: subsequent tasks consume certificates before play handlers run.
  when: opensearch_configuration.changed  # noqa: no-handler
  become: false
  delegate_to: localhost
  ansible.builtin.file:
    dest: /tmp/opensearch-nodecerts/tools/sgtlstool.sh
    mode: a+x

- name: Security Plugin configuration | Prepare the certificates generation template file
  run_once: true
  # Must run here: subsequent tasks consume certificates before play handlers run.
  when: opensearch_configuration.changed  # noqa: no-handler
  become: false
  delegate_to: localhost
  ansible.builtin.template:
    src: tlsconfig.yml
    dest: /tmp/opensearch-nodecerts/config/tlsconfig.yml
    mode: "0600"

- name: Security Plugin configuration | Generate the node & admin certificates in local
  run_once: true
  # Must run here: subsequent tasks consume certificates before play handlers run.
  when: opensearch_configuration.changed  # noqa: no-handler
  become: false
  delegate_to: localhost
  ansible.builtin.command:
    cmd: /tmp/opensearch-nodecerts/tools/sgtlstool.sh -c /tmp/opensearch-nodecerts/config/tlsconfig.yml -ca -crt -t /tmp/opensearch-nodecerts/config/
    creates: /tmp/opensearch-nodecerts/config/root-ca.pem

- name: Security Plugin configuration | IaC enabled - Check certificate
  when: iac_enable
  block:
    - name: Security Plugin configuration | Check cert exists
      ansible.builtin.stat:
        path: "{{ item }}"
        get_attributes: false
        get_checksum: false
        get_mime: false
      register: opensearch_cert_stat_result
      with_items:
        - "{{ opensearch_os_conf_dir }}/root-ca.pem"
        - "{{ opensearch_os_conf_dir }}/root-ca.key"
        - "{{ opensearch_os_conf_dir }}/{{ inventory_hostname }}.key"
        - "{{ opensearch_os_conf_dir }}/{{ inventory_hostname }}.pem"
        - "{{ opensearch_os_conf_dir }}/{{ inventory_hostname }}_http.key"
        - "{{ opensearch_os_conf_dir }}/{{ inventory_hostname }}_http.pem"
        - "{{ opensearch_os_conf_dir }}/admin.key"
        - "{{ opensearch_os_conf_dir }}/admin.pem"
    - name: Security Plugin configuration | Set fact. The initial value "Don't update certs"
      ansible.builtin.set_fact:
        opensearch_force_update_cert: false
    - name: Security Plugin configuration | Set fact. Update certificates if at least one certificate is not found
      ansible.builtin.set_fact:
        opensearch_force_update_cert: true
      with_items: "{{ opensearch_cert_stat_result.results }}"
      when: not item.stat.exists
    - name: Security Plugin configuration | Show the opensearch_force_update_cert setting
      ansible.builtin.debug:
        msg: "opensearch_force_update_cert: {{ opensearch_force_update_cert }}"
    - name: Security Plugin configuration | Count opensearch_force_update_cert nodes
      ansible.builtin.set_fact:
        opensearch_force_update_cert_nodes_count: >-
          {{ hostvars | dict2items
             | selectattr('value.opensearch_force_update_cert', 'defined')
             | rejectattr('value.opensearch_force_update_cert', 'equalto', false)
             | map(attribute='value.opensearch_force_update_cert') | list | length }}
    - name: Security Plugin configuration | Show the opensearch_force_update_cert_nodes_count setting
      ansible.builtin.debug:
        msg: "opensearch_force_update_cert_nodes_count: {{ opensearch_force_update_cert_nodes_count }}"
    - name: Security Plugin configuration | Do need to update certificates
      ansible.builtin.debug:
        msg: Need to update certificates...
      when: opensearch_force_update_cert_nodes_count | int > 0

- name: Security Plugin configuration | IaC disabled - Count opensearch_force_update_cert nodes
  ansible.builtin.set_fact:
    opensearch_force_update_cert_nodes_count: 0
  when: not iac_enable

- name: Security Plugin configuration | Copy the node & admin certificates to opensearch nodes if at least one certificate is not found on at least one server
  ansible.builtin.copy:
    src: /tmp/opensearch-nodecerts/config/{{ item }}
    dest: "{{ opensearch_os_conf_dir }}"
    mode: "0600"
  with_items:
    - root-ca.pem
    - root-ca.key
    - "{{ inventory_hostname }}.key"
    - "{{ inventory_hostname }}.pem"
    - "{{ inventory_hostname }}_http.key"
    - "{{ inventory_hostname }}_http.pem"
    - admin.key
    - admin.pem
  when: (opensearch_configuration.changed and not iac_enable) or (iac_enable and opensearch_force_update_cert_nodes_count | int > 0)

- name: Security Plugin configuration | Copy the security configuration file 1 to cluster
  ansible.builtin.blockinfile:
    block: "{{ lookup('template', 'templates/security_conf.yml') }}"
    dest: "{{ opensearch_os_conf_dir }}/opensearch.yml"
    backup: true
    insertafter: EOF
    marker: "## {mark} OpenSearch Security common configuration ##"
  when: opensearch_configuration.changed or iac_enable

- name: Security Plugin configuration | Copy the security configuration file 2 to cluster
  ansible.builtin.blockinfile:
    block: "{{ lookup('file', '/tmp/opensearch-nodecerts/config/' ~ inventory_hostname ~ '_elasticsearch_config_snippet.yml') }}"
    dest: "{{ opensearch_os_conf_dir }}/opensearch.yml"
    backup: true
    insertafter: EOF
    marker: "## {mark} opensearch Security Node & Admin certificates configuration ##"
  when: opensearch_configuration.changed or iac_enable

- name: Security Plugin configuration | Create security plugin configuration folder
  ansible.builtin.file:
    dest: "{{ opensearch_os_sec_plugin_conf_path }}"
    owner: "{{ os_user }}"
    group: "{{ os_user }}"
    mode: "0700"
    state: directory
  when: opensearch_configuration.changed or iac_enable

- name: Security Plugin configuration | Copy the security configuration file 3 to cluster
  ansible.builtin.template:
    src: security_plugin_conf.yml
    dest: "{{ opensearch_os_sec_plugin_conf_path }}/config.yml"
    backup: true
    owner: "{{ os_user }}"
    group: "{{ os_user }}"
    mode: "0600"
    force: true
  when: opensearch_auth_type == 'oidc' or copy_custom_security_configs

- name: Security Plugin configuration | Prepare the opensearch security configuration file
  when: opensearch_configuration.changed or iac_enable
  ansible.builtin.replace:
    path: "{{ opensearch_os_conf_dir }}/opensearch.yml"
    regexp: searchguard
    replace: plugins.security

- name: Security Plugin configuration | Set the file ownerships
  ansible.builtin.file:
    dest: "{{ opensearch_os_home }}"
    owner: "{{ os_user }}"
    group: "{{ os_user }}"
    recurse: true

- name: Security Plugin configuration | Set the folder permission
  ansible.builtin.file:
    dest: "{{ opensearch_os_conf_dir }}"
    owner: "{{ os_user }}"
    group: "{{ os_user }}"
    mode: "0700"

- name: Security Plugin configuration | Restart opensearch with security configuration
  ansible.builtin.systemd:
    name: opensearch
    daemon_reload: true
    state: restarted
    enabled: true

- name: Wait for opensearch to startup
  ansible.builtin.wait_for:
    host: "{{ hostvars[inventory_hostname]['ip'] }}"
    port: "{{ opensearch_os_api_port }}"
    delay: 5
    connect_timeout: 1
    timeout: 200

- name: Security Plugin configuration | Copy the opensearch security internal users template
  ansible.builtin.template:
    src: internal_users.yml
    dest: "{{ opensearch_os_sec_plugin_conf_path }}/internal_users.yml"
    mode: "0644"
  run_once: true
  when: opensearch_configuration.changed or iac_enable

- name: Security Plugin configuration | Copy custom configuration files to cluster
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ opensearch_os_sec_plugin_conf_path }}/"
    owner: "{{ os_user }}"
    group: "{{ os_user }}"
    backup: true
    mode: "0640"
    force: true
  with_items: "{{ custom_security_plugin_configs }}"
  when: copy_custom_security_configs

- name: Hash admin_password
  ansible.builtin.command:
    argv:
      - bash
      - "{{ opensearch_os_sec_plugin_tools_path }}/hash.sh"
      - -p
      - "{{ admin_password }}"
  environment:
    JAVA_HOME: "{{ opensearch_os_home }}/jdk"
  register: opensearch_password_hash
  changed_when: false
  no_log: true
  run_once: true
  when: opensearch_configuration.changed or iac_enable

- name: Security Plugin configuration | Set the Admin user password
  ansible.builtin.replace:
    path: "{{ opensearch_os_sec_plugin_conf_path }}/internal_users.yml"
    regexp: (?m)^(\s*hash:\s*['\"]?){{ admin_password | regex_escape }}(['\"]?\s*)$
    replace: \g<1>{{ opensearch_password_hash.stdout_lines | last }}\g<2>
  no_log: true
  run_once: true
  when: opensearch_configuration.changed or iac_enable

- name: Hash kibanaserver_password
  ansible.builtin.command:
    argv:
      - bash
      - "{{ opensearch_os_sec_plugin_tools_path }}/hash.sh"
      - -p
      - "{{ kibanaserver_password }}"
  environment:
    JAVA_HOME: "{{ opensearch_os_home }}/jdk"
  register: opensearch_password_hash
  changed_when: false
  no_log: true
  run_once: true
  when: opensearch_configuration.changed or iac_enable

- name: Security Plugin configuration | Set the kibanaserver user pasword
  ansible.builtin.replace:
    path: "{{ opensearch_os_sec_plugin_conf_path }}/internal_users.yml"
    regexp: (?m)^(\s*hash:\s*['\"]?){{ kibanaserver_password | regex_escape }}(['\"]?\s*)$
    replace: \g<1>{{ opensearch_password_hash.stdout_lines | last }}\g<2>
  no_log: true
  run_once: true
  when: opensearch_configuration.changed or iac_enable

- name: Security Plugin configuration | Check that the files/internal_users.yml exists
  ansible.builtin.stat:
    path: files/internal_users.yml
  register: opensearch_custom_users_result
  delegate_to: localhost
  run_once: true
  become: false

- name: Security Plugin configuration | Check for a custom configuration for internal users and hash passwords for them
  when: opensearch_custom_users_result.stat.exists
  block:
    - name: Security Plugin configuration | Load custom internal users configuration
      ansible.builtin.include_vars:
        file: files/internal_users.yml
        name: custom_users
      run_once: true
    # In the internal_users file.yml each user is described by the block:
    # username:
    #   hash: "{{ username_password }}"In addition to the user description blocks, there is a _meta block
    #   ...
    # In addition to the user description blocks, there is a _meta block
    # In this task, all usernames are selected from the file (excluding the _meta block), for which hashed
    # passwords will be written next
    - name: Security Plugin configuration | Filter service keys from the list of users
      ansible.builtin.set_fact:
        opensearch_custom_users_filtered: '{{ custom_users | dict2items | rejectattr("key", "equalto", "_meta") | list | items2dict }}'
    # Hashed passwords are written for all users found in the previous task. Passwords are searched in variables
    # set by the user when starting the role (admin_password, kibanaserver_password, etc.).
    - name: Hash custom user passwords
      ansible.builtin.command:
        argv:
          - bash
          - "{{ opensearch_os_sec_plugin_tools_path }}/hash.sh"
          - -p
          - "{{ lookup('vars', item + '_password') }}"
      environment:
        JAVA_HOME: "{{ opensearch_os_home }}/jdk"
      register: opensearch_password_hashes
      changed_when: false
      no_log: true
      run_once: true
      when: opensearch_configuration.changed or copy_custom_security_configs
      loop: "{{ opensearch_custom_users_filtered | list }}"
    - name: Security Plugin configuration | Set passwords for all users from custom config
      ansible.builtin.replace:
        path: "{{ opensearch_os_sec_plugin_conf_path }}/internal_users.yml"
        regexp: (?m)^(\s*hash:\s*['\"]?){{ lookup('vars', item.item + '_password') | regex_escape }}(['\"]?\s*)$
        replace: \g<1>{{ item.stdout_lines | last }}\g<2>
      no_log: true
      run_once: true
      when: opensearch_configuration.changed or copy_custom_security_configs
      loop: "{{ opensearch_password_hashes.results }}"

- name: Security Plugin configuration | Initialize the opensearch security index in opensearch with custom configs
  environment:
    JAVA_HOME: "{{ opensearch_os_home }}/jdk"
  run_once: true
  when: opensearch_configuration.changed and copy_custom_security_configs
  ansible.builtin.command: >
    bash {{ opensearch_os_sec_plugin_tools_path }}/securityadmin.sh
    -cacert {{ opensearch_os_conf_dir }}/root-ca.pem
    -cert {{ opensearch_os_conf_dir }}/admin.pem
    -key {{ opensearch_os_conf_dir }}/admin.key
    -cd {{ opensearch_os_sec_plugin_conf_path }}
    -nhnv -icl
    -h {{ hostvars[inventory_hostname]['ip'] }}
  changed_when: true

- name: Security Plugin configuration | Initialize the opensearch security index in opensearch with default configs
  environment:
    JAVA_HOME: "{{ opensearch_os_home }}/jdk"
  run_once: true
  when: opensearch_configuration.changed and not copy_custom_security_configs
  ansible.builtin.command: >
    bash {{ opensearch_os_sec_plugin_tools_path }}/securityadmin.sh
    -cacert {{ opensearch_os_conf_dir }}/root-ca.pem
    -cert {{ opensearch_os_conf_dir }}/admin.pem
    -key {{ opensearch_os_conf_dir }}/admin.key
    -f {{ opensearch_os_sec_plugin_conf_path }}/internal_users.yml
    -nhnv -icl
    -h {{ hostvars[inventory_hostname]['ip'] }}
  changed_when: true

- name: Security Plugin configuration | Cleanup local temporary directory
  run_once: true
  # Clean up only after all certificate consumers have completed.
  when: opensearch_configuration.changed  # noqa: no-handler
  become: false
  delegate_to: localhost
  ansible.builtin.file:
    path: /tmp/opensearch-nodecerts
    state: absent
