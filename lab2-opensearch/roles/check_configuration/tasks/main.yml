---
- name: Validate the three-node inventory
  ansible.builtin.assert:
    that:
      - groups['os-cluster'] | length == 3
      - groups['dashboards'] | length == 1
      - groups['dashboards'][0] in groups['os-cluster']
    fail_msg: Expected os-hot, os-warm and os-manager, with Dashboards on os-manager.

- name: Check local Java (required by upstream TLS generation tool)
  ansible.builtin.command: java -version
  register: check_configuration_local_java
  changed_when: false
  failed_when: false

- name: Require local Java 21 or later
  ansible.builtin.assert:
    that:
      - check_configuration_local_java.rc == 0
      - (check_configuration_local_java.stderr | regex_search('version "([0-9]+)', '\\1') | first | int) >= 21
    fail_msg: Install a Java 21+ JRE/JDK on the Ansible controller; upstream Search Guard TLS Tool runs locally.
