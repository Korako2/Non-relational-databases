log_format opensearch_json escape=json
  '{'
    '"@timestamp":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"request":"$request",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"user_agent":"$http_user_agent"'
  '}';

server {
    listen 127.0.0.1:8080;
    server_name _;

    root /var/www/opensearch-lab;
    index index.html;

    access_log /var/log/nginx/opensearch-access.json opensearch_json;

    location / {
        try_files $uri $uri/ =404;
    }
}
