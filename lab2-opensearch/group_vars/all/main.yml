---
ansible_python_interpreter: /usr/bin/python3

domain_name: lab.internal
os_user: opensearch
os_dashboards_user: opensearch-dashboards
cert_valid_days: 730
auth_type: internal
copy_custom_security_configs: false
iac_enable: false
populate_inventory_to_hosts_file: true

admin_password: "{{ vault_admin_password }}"
kibanaserver_password: "{{ vault_dashboards_password }}"

lab_dashboards_conf_dir: /usr/share/opensearch-dashboards/config
lab_opensearch_conf_dir: /usr/share/opensearch/config
custom_security_plugin_configs: []
