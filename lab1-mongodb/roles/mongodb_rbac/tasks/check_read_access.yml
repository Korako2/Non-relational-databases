- name: Check MongoDB read access
  community.mongodb.mongodb_shell:
    login_host: "127.0.0.1"
    login_port: "{{ mongodb_port }}"
    login_database: admin
    login_user: "{{ mongodb_rbac_check_user }}"
    login_password: "{{ mongodb_rbac_check_password }}"
    db: "{{ mongodb_rbac_check_database }}"
    eval: >-
      db.getCollection({{ mongodb_rbac_check_collection | to_json }}).findOne()
    debug: true
  register: mongodb_rbac_access_result

  failed_when: false
  changed_when: false
  no_log: true

- name: Verify expected MongoDB access
  ansible.builtin.assert:
    that:
      - >
        (
          mongodb_rbac_access_result.rc == 0
          and (mongodb_rbac_expect_access | bool)
        )
        or
        (
          mongodb_rbac_access_result.rc != 0
          and not (mongodb_rbac_expect_access | bool)
        )

    success_msg: >-
      Access check passed:
      {{ mongodb_rbac_check_user }}
      {{ 'CAN' if mongodb_rbac_expect_access else 'CANNOT' }}
      read
      {{ mongodb_rbac_check_database }}.{{ mongodb_rbac_check_collection }}

    fail_msg: >-
      Unexpected access result for
      {{ mongodb_rbac_check_user }}
      on
      {{ mongodb_rbac_check_database }}.{{ mongodb_rbac_check_collection }}
