- name: Set paths for HTTPS material
  ansible.builtin.set_fact:
    dashboard_key: "{{ lab_dashboards_conf_dir }}/dashboards-server.key"
    dashboard_csr: "{{ lab_dashboards_conf_dir }}/dashboards-server.csr"
    dashboard_cert: "{{ lab_dashboards_conf_dir }}/dashboards-server.pem"
    dashboard_ca: "{{ lab_dashboards_conf_dir }}/root-ca.pem"
    dashboard_config: "{{ lab_dashboards_conf_dir }}/opensearch_dashboards.yml"

- name: Copy upstream-generated trusted CA certificate for OpenSearch HTTPS
  ansible.builtin.copy:
    src: "{{ lab_opensearch_conf_dir }}/root-ca.pem"
    dest: "{{ dashboard_ca }}"
    remote_src: true
    owner: '{{ os_dashboards_user }}'
    group: '{{ os_dashboards_user }}'
    mode: '0644'
  register: dashboard_ca_changed

- name: Save OpenSSL SAN specification for Dashboards browser certificate
  ansible.builtin.copy:
    dest: "{{ lab_dashboards_conf_dir }}/dashboards-san.ext"
    content: |
      basicConstraints=CA:FALSE
      keyUsage=digitalSignature,keyEncipherment
      extendedKeyUsage=serverAuth
      subjectAltName=IP:{{ ip }},IP:127.0.0.1,DNS:{{ inventory_hostname }},DNS:{{ inventory_hostname }}.{{ domain_name }},DNS:localhost
    owner: '{{ os_dashboards_user }}'
    group: '{{ os_dashboards_user }}'
    mode: '0644'

- name: Generate private key for the Dashboards HTTPS endpoint
  ansible.builtin.command:
    argv: [openssl, genrsa, -out, '{{ dashboard_key }}', '2048']
    creates: '{{ dashboard_key }}'
  no_log: true

- name: Restrict private-key access
  ansible.builtin.file:
    path: '{{ dashboard_key }}'
    owner: '{{ os_dashboards_user }}'
    group: '{{ os_dashboards_user }}'
    mode: '0600'

- name: Create signing request for Dashboards HTTPS endpoint
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -new
      - -key
      - '{{ dashboard_key }}'
      - -out
      - '{{ dashboard_csr }}'
      - -subj
      - '/CN={{ inventory_hostname }}.{{ domain_name }}'
    creates: '{{ dashboard_csr }}'

- name: Sign the Dashboards certificate with the upstream-generated lab CA
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -req
      - -in
      - '{{ dashboard_csr }}'
      - -CA
      - '{{ lab_opensearch_conf_dir }}/root-ca.pem'
      - -CAkey
      - '{{ lab_opensearch_conf_dir }}/root-ca.key'
      - -CAcreateserial
      - -out
      - '{{ dashboard_cert }}'
      - -days
      - '365'
      - -sha256
      - -extfile
      - '{{ lab_dashboards_conf_dir }}/dashboards-san.ext'
    creates: '{{ dashboard_cert }}'
  no_log: true
  register: dashboard_signed

- name: Set Dashboards HTTPS certificate permissions
  ansible.builtin.file:
    path: '{{ dashboard_cert }}'
    owner: '{{ os_dashboards_user }}'
    group: '{{ os_dashboards_user }}'
    mode: '0644'

- name: Enable server-side HTTPS in Dashboards
  ansible.builtin.blockinfile:
    path: '{{ dashboard_config }}'
    marker: '# {mark} LAB HTTPS SETTINGS'
    block: |
      server.ssl.enabled: true
      server.ssl.certificate: {{ dashboard_cert }}
      server.ssl.key: {{ dashboard_key }}
      opensearch.ssl.certificateAuthorities: ["{{ dashboard_ca }}"]
  register: dashboard_https_settings

- name: Verify upstream OpenSearch backend certificate using its CA and host/IP
  ansible.builtin.lineinfile:
    path: '{{ dashboard_config }}'
    regexp: '^opensearch\.ssl\.verificationMode:'
    line: 'opensearch.ssl.verificationMode: full'
  register: dashboard_verify_setting

- name: Secure authentication cookies now that server HTTPS is enabled
  ansible.builtin.lineinfile:
    path: '{{ dashboard_config }}'
    regexp: '^opensearch_security\.cookie\.secure:'
    line: 'opensearch_security.cookie.secure: true'
  register: dashboard_cookie_setting

- name: Restart Dashboards after TLS or certificate updates
  ansible.builtin.systemd:
    name: dashboards
    state: restarted
  when: dashboard_ca_changed.changed or dashboard_signed.changed or dashboard_https_settings.changed or dashboard_verify_setting.changed or dashboard_cookie_setting.changed

- name: Confirm Dashboards HTTPS listener is reachable from the VM
  ansible.builtin.wait_for:
    host: '{{ ip }}'
    port: 5601
    delay: 4
    timeout: 180

- name: Export the PUBLIC CA certificate to the Ansible controller for browser trust
  ansible.builtin.fetch:
    src: '{{ dashboard_ca }}'
    dest: '{{ playbook_dir }}/../files/root-ca.pem'
    flat: true
