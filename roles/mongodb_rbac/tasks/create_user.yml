- name: "Create MongoDB user {{ rbac_user_name }}"
  community.mongodb.mongodb_user:
    database: "{{ rbac_user_database | default('admin') }}"
    name: "{{ rbac_user_name }}"
    password: "{{ rbac_user_password }}"
    roles: "{{ rbac_user_roles }}"
    login_host: "127.0.0.1"
    login_port: "{{ mongodb_port }}"
    login_database: admin
    login_user: "{{ mongodb_admin_user }}"
    login_password: "{{ vault_mongodb_admin_password }}"
    update_password: on_create
    state: present
  vars:
    ansible_python_interpreter: "{{ mongodb_ansible_python }}"
  no_log: true
