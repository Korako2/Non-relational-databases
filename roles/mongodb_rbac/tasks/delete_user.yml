- name: "Delete MongoDB user {{ mongodb_rbac_user_name }}"
  community.mongodb.mongodb_user:
    database: "{{ mongodb_rbac_user_database | default('admin') }}"
    name: "{{ mongodb_rbac_user_name }}"
    login_host: "127.0.0.1"
    login_port: "{{ mongodb_port }}"
    login_database: admin
    login_user: "{{ mongodb_admin_user }}"
    login_password: "{{ vault_mongodb_admin_password }}"
    state: absent
  vars:
    ansible_python_interpreter: "{{ mongodb_ansible_python }}"
  no_log: true
