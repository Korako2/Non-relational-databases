- name: >-
    Check read access for {{ rbac_check_user }}
    to {{ rbac_check_database }}.{{ rbac_check_collection }}
  community.mongodb.mongodb_shell:
    login_host: "127.0.0.1"
    login_port: "{{ mongodb_port }}"
    login_database: admin
    login_user: "{{ rbac_check_user }}"
    login_password: "{{ rbac_check_password }}"
    db: "{{ rbac_check_database }}"
    eval: >-
      db.getCollection({{ rbac_check_collection | to_json }}).findOne()
    debug: true
  register: rbac_access_result

  failed_when: false
  changed_when: false
  no_log: true

- name: Verify expected MongoDB access
  ansible.builtin.assert:
    that:
      - >
        (
          rbac_access_result.rc == 0
          and (rbac_expect_access | bool)
        )
        or
        (
          rbac_access_result.rc != 0
          and not (rbac_expect_access | bool)
        )

    success_msg: >-
      Access check passed:
      {{ rbac_check_user }}
      {{ 'CAN' if rbac_expect_access else 'CANNOT' }}
      read
      {{ rbac_check_database }}.{{ rbac_check_collection }}

    fail_msg: >-
      Unexpected access result for
      {{ rbac_check_user }}
      on
      {{ rbac_check_database }}.{{ rbac_check_collection }}
