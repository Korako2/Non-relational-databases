name: lab4

services:
  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.8}
    environment:
      CLICKHOUSE_USER: lab_admin
      CLICKHOUSE_PASSWORD: ${CH_ADMIN_PASSWORD:?Run scripts/init_env.py}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [CMD-SHELL, 'clickhouse-client --user lab_admin --password "$${CLICKHOUSE_PASSWORD}" --query "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  init:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.8}
    entrypoint: [ /bin/bash, /setup/init.sh ]
    environment:
      CH_ADMIN_PASSWORD: ${CH_ADMIN_PASSWORD:?required}
      CH_WRITER_PASSWORD: ${CH_WRITER_PASSWORD:?required}
      CH_READER_PASSWORD: ${CH_READER_PASSWORD:?required}
    volumes:
      - ./clickhouse:/setup:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: 'no'
volumes:
  clickhouse_data: