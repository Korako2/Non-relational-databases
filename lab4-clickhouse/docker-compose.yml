name: lab4

services:
  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.8}
    environment:
      CLICKHOUSE_USER: lab_admin
      CLICKHOUSE_PASSWORD: ${CH_ADMIN_PASSWORD:?Run scripts/init_env.py}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [CMD-SHELL, 'clickhouse-client --user lab_admin --password "$${CLICKHOUSE_PASSWORD}" --query "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  init:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.8}
    entrypoint: [ /bin/bash, /setup/init.sh ]
    environment:
      CH_ADMIN_PASSWORD: ${CH_ADMIN_PASSWORD:?required}
      CH_WRITER_PASSWORD: ${CH_WRITER_PASSWORD:?required}
      CH_READER_PASSWORD: ${CH_READER_PASSWORD:?required}
    volumes:
      - ./clickhouse:/setup:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: 'no'

  generator:
    image: ${PYTHON_IMAGE:-python:3.12-slim}
    command: [ python, -u, /app/generator.py ]
    environment:
      CH_URL: http://clickhouse:8123
      CH_USER: lab_writer
      CH_PASSWORD: ${CH_WRITER_PASSWORD:?required}
      BATCH_SIZE: ${BATCH_SIZE:-500}
      BATCH_INTERVAL: ${BATCH_INTERVAL:-5}
    volumes:
      - ./generator:/app:ro
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.1.1}
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?required}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.15.0
      CH_READER_PASSWORD: ${CH_READER_PASSWORD:?required}
    ports:
      - '${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  clickhouse_data:
  grafana_data: